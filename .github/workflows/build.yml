name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on:macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ./PhotoRemoteCam
        run: xcodegen generate

      - name: Build unsigned app
        working-directory: ./PhotoRemoteCam
        run: |
          xcodebuild -project PhotoRemoteCam.xcodeproj \
            -scheme PhotoRemoteCam \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ./build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build

      - name: Pack IPA
        working-directory: ./PhotoRemoteCam
        run: |
          APP_PATH=$(find ./build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          echo "APP: $APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry PhotoRemoteCam.ipa Payload
          ls -lh PhotoRemoteCam.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhotoRemoteCam-IPA
          path: ./PhotoRemoteCam/PhotoRemoteCam.ipa
          retention-days: 90
